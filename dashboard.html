<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEA Payment Intelligence Monitor — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #6C5CE7;
    --bg-deep: #5B4BD6;
    --card: #FFFFFF;
    --card-soft: #F4F2FF;
    --gold: #F5B93F;
    --ink: #2B2350;
    --ink-mid: rgba(43,35,80,0.6);
    --ink-low: rgba(43,35,80,0.4);

    --overdue: #E8564C;
    --due-soon: #F5B93F;
    --on-track: #34C38F;

    --font-body: 'Poppins', -apple-system, sans-serif;

    --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .hero{
    padding: var(--sp-6) var(--sp-6) 0 var(--sp-6);
    max-width: 720px;
    margin: 0 auto;
  }
  .product-title{
    font-weight: 700;
    font-size: 30px;
    color: #fff;
    letter-spacing: 0.01em;
    margin: 0 0 var(--sp-5) 0;
  }
  .product-title .product-sub{
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    font-size: 20px;
  }

  .main-tabs{ display: flex; gap: var(--sp-2); margin-bottom: var(--sp-6); }
  .main-tab{
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }
  .main-tab:hover{ background: rgba(255,255,255,0.1); color: #fff; }
  .main-tab.active{ background: #fff; color: var(--ink); }

  main{ max-width: 720px; margin: 0 auto; padding: var(--sp-6); }

  .tab-panel{ display: none; }
  .tab-panel.active{ display: block; }

  .section-heading{ font-weight: 600; font-size: 20px; color: #fff; margin: 0 0 var(--sp-4) 0; }

  .filter-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    flex-wrap: wrap;
    margin-bottom: var(--sp-6);
  }
  .filter-chips, .team-tabs{ display: flex; gap: var(--sp-2); flex-wrap: wrap; }
  .filter-chip, .team-tab{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }
  .filter-chip:hover, .team-tab:hover{ background: rgba(255,255,255,0.22); }
  .filter-chip.active, .team-tab.active{ background: var(--gold); color: var(--ink); font-weight: 600; }

  .team-tabs{ margin-bottom: var(--sp-6); }

  .scheme-select{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .scheme-select option{ color: var(--ink); }

  .empty-state{ color: rgba(255,255,255,0.6); font-size: 14px; }

  /* ---------- SUBSCRIBE TAB ---------- */
  .subscribe-intro{ font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: var(--sp-5); }
  .subscribe-schemes{ display: flex; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .scheme-check{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 6px 12px;
  }
  .scheme-check input{ accent-color: var(--gold); }

  .subscribe-form{ display: flex; gap: var(--sp-3); max-width: 420px; }
  .subscribe-form input[type="email"]{
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 10px 16px;
    color: #fff;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .subscribe-form input[type="email"]::placeholder{ color: rgba(255,255,255,0.5); }
  .btn-subscribe{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-subscribe:active{ transform: scale(0.97); }
  .subscribe-confirm{ margin-top: var(--sp-3); font-size: 13px; color: var(--on-track); min-height: 18px; }
  .subscribe-confirm.error{ color: var(--overdue); }

  /* ---------- CIRCULAR CARD ---------- */
  .circular-card{
    position: relative;
    background: var(--card);
    border-radius: 28px;
    padding: var(--sp-6);
    box-shadow: 0 20px 40px -16px rgba(30, 20, 80, 0.35);
    margin-bottom: var(--sp-3);
  }

  .card-top{ display: flex; align-items: center; gap: var(--sp-4); }

  .icon-tile{
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--card-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float 3.4s ease-in-out infinite;
  }
  .icon-tile svg{ width: 32px; height: 32px; }

  @keyframes float{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }

  .card-top-text{ flex: 1; min-width: 0; }
  .scheme-label{ font-size: 13px; font-weight: 500; color: var(--ink-mid); letter-spacing: 0.02em; }
  .circular-title{ margin-top: 2px; font-size: 18px; font-weight: 600; color: var(--ink); line-height: 1.3; }

  .flow{ position: relative; height: 56px; margin: var(--sp-4) 0; }
  .flow svg{ width: 100%; height: 100%; overflow: visible; }
  .flow-path{
    fill: none;
    stroke: var(--card-soft);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 6 10;
    animation: dash 1.6s linear infinite;
  }
  @keyframes dash{ to{ stroke-dashoffset: -32; } }

  .status-row{ display: flex; align-items: center; justify-content: space-between; }

  .status-pill{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 8px 16px;
    border-radius: 999px;
    animation: pop 0.4s cubic-bezier(0.23, 1, 0.32, 1) 0.2s both;
  }
  .status-pill::before{ content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status-pill.overdue{ background: rgba(232,86,76,0.12); color: var(--overdue); }
  .status-pill.due-soon{ background: rgba(245,185,63,0.16); color: #b8791f; }
  .status-pill.on-track{ background: rgba(52,195,143,0.14); color: var(--on-track); }
  .status-pill.informational{ background: rgba(52,195,143,0.14); color: var(--on-track); }

  @keyframes pop{
    from{ opacity: 0; transform: scale(0.85); }
    to{ opacity: 1; transform: scale(1); }
  }

  .urgency-tag{ font-size: 12px; font-weight: 600; color: var(--ink-mid); }
  .urgency-tag.mandatory{ color: var(--overdue); }
  .urgency-tag.optional{ color: #b8791f; }
  .urgency-tag.informational{ color: var(--on-track); }

  .scope-tag{ font-size: 12.5px; font-weight: 500; color: var(--ink-mid); max-width: 60%; }
  .scope-tag strong{ color: var(--ink); font-weight: 600; }

  .effective-date{ margin-top: var(--sp-4); font-size: 12.5px; color: var(--ink-mid); }
  .effective-date strong{ color: var(--ink); font-weight: 600; }

  .ref{
    margin-top: var(--sp-5);
    padding-top: var(--sp-4);
    border-top: 1px solid var(--card-soft);
    font-size: 12px;
    color: var(--ink-low);
    text-align: right;
  }
  .ref a{ color: var(--ink-mid); text-decoration: underline; }
  .ref a:hover{ color: var(--ink); }

  /* ---------- TASKS TAB ---------- */
  .task-list{ display: flex; flex-direction: column; gap: var(--sp-3); margin-bottom: var(--sp-7); }

  .task-row{
    background: var(--card);
    border-radius: 18px;
    padding: var(--sp-5);
    box-shadow: 0 14px 28px -14px rgba(30, 20, 80, 0.35);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
  }
  .task-row.done{ opacity: 0.55; }
  .task-info{ min-width: 0; }
  .task-scheme{ font-size: 11.5px; font-weight: 600; color: var(--ink-mid); letter-spacing: 0.03em; }
  .task-title{ font-size: 15px; font-weight: 600; color: var(--ink); margin-top: 2px; }
  .task-title.done{ text-decoration: line-through; }
  .task-deadline{ font-size: 12.5px; color: var(--ink-mid); margin-top: 4px; }
  .task-deadline.overdue{ color: var(--overdue); font-weight: 600; }

  .task-action{ flex-shrink: 0; }
  .btn-complete{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--card-soft);
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 140ms ease, transform 140ms ease;
  }
  .btn-complete:hover{ background: rgba(43,35,80,0.12); }
  .btn-complete:active{ transform: scale(0.96); }
  .done-badge{
    font-size: 12px;
    font-weight: 600;
    color: var(--on-track);
    background: rgba(52,195,143,0.14);
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
  }

  .audit-section h2{ font-size: 16px; font-weight: 600; color: #fff; margin: 0 0 var(--sp-4) 0; }
  .audit-panel{
    background: rgba(0,0,0,0.14);
    border-radius: 16px;
    padding: var(--sp-4) var(--sp-5);
    max-height: 260px;
    overflow-y: auto;
  }
  .audit-row{
    font-size: 12.5px;
    color: rgba(255,255,255,0.75);
    padding: var(--sp-2) 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .audit-row:last-child{ border-bottom: none; }
  .audit-row time{ color: rgba(255,255,255,0.45); margin-right: var(--sp-3); font-variant-numeric: tabular-nums; }

  @media (max-width: 600px){
    .main-tabs{ flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <header class="hero">
    <h1 class="product-title">MEA PIM <span class="product-sub">(Payment Intelligence Monitor)</span></h1>
    <div class="main-tabs" id="main-tabs">
      <button type="button" class="main-tab active" data-tab="circulars">Circulars</button>
      <button type="button" class="main-tab" data-tab="tasks">Tasks</button>
      <button type="button" class="main-tab" data-tab="subscribe">Subscribe</button>
    </div>
  </header>

  <main>

    <!-- ---------- CIRCULARS TAB ---------- -->
    <section class="tab-panel active" id="panel-circulars">
      <div class="filter-bar">
        <div class="filter-chips" id="status-filters">
          <button type="button" class="filter-chip active" data-status="all">All</button>
          <button type="button" class="filter-chip" data-status="overdue">Overdue</button>
          <button type="button" class="filter-chip" data-status="due-soon">Due Soon</button>
          <button type="button" class="filter-chip" data-status="on-track">On Track</button>
          <button type="button" class="filter-chip" data-status="informational">Informational</button>
        </div>
        <select class="scheme-select" id="scheme-filter">
          <option value="all">All schemes</option>
        </select>
      </div>

      <div id="circular-list">
        <p class="empty-state">Loading circulars…</p>
      </div>
    </section>

    <!-- ---------- TASKS TAB ---------- -->
    <section class="tab-panel" id="panel-tasks">
      <div class="team-tabs" id="team-tabs">
        <button type="button" class="team-tab active" data-team="all">All Teams</button>
        <button type="button" class="team-tab" data-team="Product">Product</button>
        <button type="button" class="team-tab" data-team="Engineering">Engineering</button>
        <button type="button" class="team-tab" data-team="Ops">Ops</button>
        <button type="button" class="team-tab" data-team="Legal">Legal</button>
        <button type="button" class="team-tab" data-team="Bank">Bank</button>
      </div>

      <div class="task-list" id="task-list">
        <p class="empty-state">Loading tasks…</p>
      </div>

      <div class="audit-section">
        <h2>Audit trail</h2>
        <div class="audit-panel" id="audit-panel">
          <p class="empty-state">Loading audit trail…</p>
        </div>
      </div>
    </section>

    <!-- ---------- SUBSCRIBE TAB ---------- -->
    <section class="tab-panel" id="panel-subscribe">
      <h2 class="section-heading">Get an email digest</h2>
      <p class="subscribe-intro">Pick the schemes you care about — leave none checked to get everything.</p>
      <div class="subscribe-schemes" id="subscribe-schemes"></div>
      <form class="subscribe-form" id="subscribe-form">
        <input type="email" id="subscribe-email" placeholder="you@bank-or-psp.com" required autocomplete="email" />
        <button type="submit" class="btn-subscribe">Subscribe</button>
      </form>
      <p class="subscribe-confirm" id="subscribe-confirm"></p>
    </section>

  </main>

<script>
  (function(){
    var CONVEX_SITE_URL = 'https://calculating-ptarmigan-789.convex.site';

    function escapeHtml(str){
      var div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    /* ---------- TOP-LEVEL TAB SWITCHING ---------- */
    var mainTabs = document.getElementById('main-tabs');
    mainTabs.addEventListener('click', function(e){
      var btn = e.target.closest('.main-tab');
      if(!btn) return;
      var tab = btn.getAttribute('data-tab');
      mainTabs.querySelectorAll('.main-tab').forEach(function(el){
        el.classList.toggle('active', el === btn);
      });
      document.querySelectorAll('.tab-panel').forEach(function(panel){
        panel.classList.toggle('active', panel.id === 'panel-' + tab);
      });
    });

    /* ---------- CIRCULARS ---------- */
    var STATUS_LABELS = {
      'informational': { cls: 'informational', text: 'INFORMATIONAL' },
      'overdue': { cls: 'overdue', text: 'OVERDUE' },
      'due-soon': { cls: 'due-soon', text: 'DUE SOON' },
      'on-track': { cls: 'on-track', text: 'ON TRACK' }
    };

    function statusPillFor(status){
      return STATUS_LABELS[status] || { cls: 'due-soon', text: escapeHtml(status || 'UNKNOWN').toUpperCase() };
    }

    function iconSvg(){
      return '<svg viewBox="0 0 24 24" fill="none">' +
        '<rect x="4" y="2" width="16" height="20" rx="3" fill="#6C5CE7"/>' +
        '<rect x="7" y="6" width="10" height="1.6" rx="0.8" fill="#fff" opacity="0.8"/>' +
        '<rect x="7" y="10" width="10" height="1.6" rx="0.8" fill="#fff" opacity="0.6"/>' +
        '<rect x="7" y="14" width="6" height="1.6" rx="0.8" fill="#fff" opacity="0.6"/>' +
        '</svg>';
    }

    function renderCircular(c){
      var pill = statusPillFor(c.status);
      return '' +
        '<div class="circular-card">' +
          '<div class="card-top">' +
            '<div class="icon-tile">' + iconSvg() + '</div>' +
            '<div class="card-top-text">' +
              '<div class="scheme-label">' + escapeHtml((c.scheme || '').toUpperCase()) + '</div>' +
              '<div class="circular-title">' + escapeHtml(c.title) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="flow"><svg viewBox="0 0 400 56" preserveAspectRatio="none">' +
            '<path class="flow-path" d="M20,10 C120,10 100,46 200,46 C300,46 280,10 380,10" />' +
          '</svg></div>' +
          '<div class="status-row">' +
            '<span class="scope-tag">Audience: <strong>' + escapeHtml(c.scope) + '</strong></span>' +
            '<span class="status-pill ' + pill.cls + '">' + pill.text + '</span>' +
          '</div>' +
          '<div class="effective-date">Effective date: <strong>' + escapeHtml(c.deadline) + '</strong></div>' +
          '<div class="ref"><a href="' + escapeHtml(c.sourceUrl) + '" target="_blank" rel="noopener">View source &#8599;</a></div>' +
        '</div>';
    }

    var circularContainer = document.getElementById('circular-list');
    var statusFilterBar = document.getElementById('status-filters');
    var schemeSelect = document.getElementById('scheme-filter');

    var allCirculars = [];
    var currentStatus = 'all';
    var currentScheme = 'all';

    function renderCircularList(list){
      if(!list.length){
        circularContainer.innerHTML = '<p class="empty-state">No circulars match this filter.</p>';
        return;
      }
      circularContainer.innerHTML = list.map(renderCircular).join('');
    }

    function applyFilters(){
      var filtered = allCirculars.filter(function(c){
        var statusOk = currentStatus === 'all' || c.status === currentStatus;
        var schemeOk = currentScheme === 'all' || c.scheme === currentScheme;
        return statusOk && schemeOk;
      });
      renderCircularList(filtered);
    }

    function populateSchemeOptions(list){
      var schemes = [];
      list.forEach(function(c){
        if(c.scheme && schemes.indexOf(c.scheme) === -1) schemes.push(c.scheme);
      });
      schemes.sort();
      schemes.forEach(function(scheme){
        var opt = document.createElement('option');
        opt.value = scheme;
        opt.textContent = scheme;
        schemeSelect.appendChild(opt);
      });

      var schemesContainer = document.getElementById('subscribe-schemes');
      schemesContainer.innerHTML = schemes.map(function(scheme){
        return '<label class="scheme-check"><input type="checkbox" value="' + escapeHtml(scheme) + '" /> ' + escapeHtml(scheme) + '</label>';
      }).join('');
    }

    statusFilterBar.addEventListener('click', function(e){
      var btn = e.target.closest('.filter-chip');
      if(!btn) return;
      currentStatus = btn.getAttribute('data-status');
      statusFilterBar.querySelectorAll('.filter-chip').forEach(function(el){
        el.classList.toggle('active', el === btn);
      });
      applyFilters();
    });

    schemeSelect.addEventListener('change', function(){
      currentScheme = schemeSelect.value;
      applyFilters();
    });

    fetch(CONVEX_SITE_URL + '/circulars')
      .then(function(res){ if(!res.ok) throw new Error('request failed'); return res.json(); })
      .then(function(list){
        allCirculars = list;
        if(!list.length){
          circularContainer.innerHTML = '<p class="empty-state">No circulars yet.</p>';
          return;
        }
        populateSchemeOptions(list);
        applyFilters();
      })
      .catch(function(){
        circularContainer.innerHTML = '<p class="empty-state">Couldn\'t load circulars — check your connection and reload.</p>';
      });

    /* ---------- TASKS ---------- */
    var taskList = document.getElementById('task-list');
    var teamTabs = document.getElementById('team-tabs');
    var auditPanel = document.getElementById('audit-panel');

    var allTasks = [];
    var currentTeam = 'all';

    function renderTaskRow(t){
      var deadlineText = t.deadline ? t.deadline : 'No deadline';
      var deadlineClass = t.overdue ? 'task-deadline overdue' : 'task-deadline';
      var isDone = t.status === 'done';
      return '' +
        '<div class="task-row' + (isDone ? ' done' : '') + '">' +
          '<div class="task-info">' +
            '<div class="task-scheme">' + escapeHtml((t.circularScheme || '').toUpperCase()) + ' &middot; ' + escapeHtml(t.team) + '</div>' +
            '<div class="task-title' + (isDone ? ' done' : '') + '">' + escapeHtml(t.circularTitle) + '</div>' +
            '<div class="' + deadlineClass + '">' + (t.overdue ? 'OVERDUE &middot; ' : '') + escapeHtml(deadlineText) + '</div>' +
          '</div>' +
          '<div class="task-action">' +
            (isDone
              ? '<span class="done-badge">Done</span>'
              : '<button type="button" class="btn-complete" data-task-id="' + escapeHtml(t._id) + '">Mark done</button>') +
          '</div>' +
        '</div>';
    }

    function renderTasks(){
      var filtered = currentTeam === 'all' ? allTasks : allTasks.filter(function(t){ return t.team === currentTeam; });
      if(!filtered.length){
        taskList.innerHTML = '<p class="empty-state">No tasks for this team.</p>';
        return;
      }
      taskList.innerHTML = filtered.map(renderTaskRow).join('');
    }

    function loadTasks(){
      return fetch(CONVEX_SITE_URL + '/tasks')
        .then(function(res){ if(!res.ok) throw new Error('request failed'); return res.json(); })
        .then(function(list){
          allTasks = list;
          renderTasks();
        })
        .catch(function(){
          taskList.innerHTML = '<p class="empty-state">Couldn\'t load tasks — check your connection and reload.</p>';
        });
    }

    function loadAuditLog(){
      fetch(CONVEX_SITE_URL + '/audit-log')
        .then(function(res){ if(!res.ok) throw new Error('request failed'); return res.json(); })
        .then(function(entries){
          if(!entries.length){
            auditPanel.innerHTML = '<p class="empty-state">No activity yet.</p>';
            return;
          }
          auditPanel.innerHTML = entries.map(function(e){
            var d = new Date(e._creationTime);
            var timeStr = d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            return '<div class="audit-row"><time>' + escapeHtml(timeStr) + '</time>' + escapeHtml(e.detail) + '</div>';
          }).join('');
        })
        .catch(function(){
          auditPanel.innerHTML = '<p class="empty-state">Couldn\'t load audit trail.</p>';
        });
    }

    teamTabs.addEventListener('click', function(e){
      var btn = e.target.closest('.team-tab');
      if(!btn) return;
      currentTeam = btn.getAttribute('data-team');
      teamTabs.querySelectorAll('.team-tab').forEach(function(el){
        el.classList.toggle('active', el === btn);
      });
      renderTasks();
    });

    taskList.addEventListener('click', function(e){
      var btn = e.target.closest('.btn-complete');
      if(!btn) return;
      var taskId = btn.getAttribute('data-task-id');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      fetch(CONVEX_SITE_URL + '/tasks/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskId: taskId })
      })
        .then(function(res){ if(!res.ok) throw new Error('request failed'); return res.json(); })
        .then(function(){ return loadTasks(); })
        .then(function(){ loadAuditLog(); })
        .catch(function(){
          btn.disabled = false;
          btn.textContent = 'Mark done';
        });
    });

    loadTasks();
    loadAuditLog();

    /* ---------- SUBSCRIBE ---------- */
    var subscribeForm = document.getElementById('subscribe-form');
    var subscribeConfirm = document.getElementById('subscribe-confirm');
    subscribeForm.addEventListener('submit', function(e){
      e.preventDefault();
      var emailInput = document.getElementById('subscribe-email');
      var checked = Array.from(document.querySelectorAll('#subscribe-schemes input:checked')).map(function(el){ return el.value; });
      var btn = subscribeForm.querySelector('button[type="submit"]');
      var originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';
      subscribeConfirm.classList.remove('error');
      subscribeConfirm.textContent = '';

      fetch(CONVEX_SITE_URL + '/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput.value, schemes: checked })
      })
        .then(function(res){ if(!res.ok) throw new Error('request failed'); return res.json(); })
        .then(function(){
          btn.disabled = false;
          btn.textContent = originalLabel;
          subscribeConfirm.textContent = checked.length
            ? 'Subscribed — you\'ll get updates for ' + checked.join(', ') + '.'
            : 'Subscribed — you\'ll get updates for every scheme.';
          emailInput.value = '';
        })
        .catch(function(){
          btn.disabled = false;
          btn.textContent = originalLabel;
          subscribeConfirm.classList.add('error');
          subscribeConfirm.textContent = "Couldn't subscribe — check your connection and try again.";
        });
    });
  })();
</script>

</body>
</html>
